version: 2.1
orbs:
  # We should periodically update this, last updated 2026-06-10
  node: circleci/node@7.2.1
jobs:
  build:
    docker:
      - image: cimg/base:stable
    working_directory: ~/repo
    steps:
      - checkout
      - node/install:
          install-yarn: true
          node-version: '24.16.0'
      - run: node --version
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      # The codecov orb would be nicer, but it is an uncertified public orb and
      # thus requires an org-level setting, so use the CLI directly instead.
      # Forked PRs get no CODECOV_TOKEN, so never fail the job on upload errors.
      - run:
          name: Upload coverage to Codecov
          command: |
            curl -sS -o /tmp/codecov https://cli.codecov.io/latest/linux/codecov
            chmod +x /tmp/codecov
            /tmp/codecov upload-process -f lcov.info -F circleci || true
      - run: mkdir ~/my_test_artifacts
      - run: echo "This should point to root_artifact.md for commit on CIRCLE_BRANCH=${CIRCLE_BRANCH} in CIRCLE_PR_NUMBER=${CIRCLE_PR_NUMBER} for commit ${CIRCLE_SHA1}" | tee ~/my_test_artifacts/root_artifact.md
      - store_artifacts:
          path: ~/my_test_artifacts
          destination: test_artifacts
