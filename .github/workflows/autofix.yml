name: autofix.ci
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true

on:  # yamllint disable-line rule:truthy
  # We only do this on PRs to avoid the (admittedly unlikely) scenario that
  # we run, green, wait, merge, then the build on `main` could fail because conda
  # has updated during the "green" and then the "build on `main`" steps
  pull_request:
    branches: ["*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Rebuild dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # autofix.ci applies the diff through its own App, so the workflow
          # itself never needs a writable token on disk
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx ncc build index.js -o dist
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a  # v1.3.4
