comment: false
github_checks:  # too noisy, even though "a" interactively disables them
  annotations: false

codecov:
  require_ci_to_pass: false

# The 100% targets are not enforcement -- `npm run coverage` fails the build
# below 100%, so these statuses are informational and just show the number.
coverage:
  status:
    patch:
      default:
        informational: true
        target: 100%
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: failure
    project:
      default:
        informational: true
        target: 100%
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: failure
